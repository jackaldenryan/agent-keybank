[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-keybank"
version = "0.1.1"
description = "Catalog-backed API key loader for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jack Ryan" }]
keywords = ["keybank", "api-keys", "agents", "skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]

[project.scripts]
keybank = "keybank.cli:main"

[project.urls]
Homepage = "https://github.com/jackaldenryan/agent-keybank"
Repository = "https://github.com/jackaldenryan/agent-keybank"
Issues = "https://github.com/jackaldenryan/agent-keybank/issues"

[tool.setuptools.packages.find]
include = ["keybank*"]

[tool.setuptools.package-data]
keybank = ["skill/SKILL.md"]
